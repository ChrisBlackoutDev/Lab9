<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-label="Illustrated breadboard layout for Lab 9 smart safe prototype">
  <defs>
    <pattern id="holes" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="5.5" fill="#c5cbd1" stroke="#9da7b1" stroke-width="1"/>
      <circle cx="14" cy="14" r="2.2" fill="#9aa4ae"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 45px; font-weight: 700; }
    .subtitle { font-size: 25px; fill: #475569; }
    .part { font-size: 26px; font-weight: 700; }
    .small { font-size: 21px; fill: #475569; }
    .pin { font-size: 23px; font-weight: 700; fill: #152b55; }
    .wire { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .red { stroke: #d23b4a; }
    .black { stroke: #293240; }
    .blue { stroke: #3072db; }
    .green { stroke: #159661; }
    .yellow { stroke: #e4a600; }
    .orange { stroke: #cc700f; }
    .purple { stroke: #8455be; }
    .grey { stroke: #64748b; }
    .ring { fill: white; stroke: #334155; stroke-width: 4; }
    .lighttext { fill: white; }
  </style>
  <rect width="2400" height="1600" fill="#f7f8fa"/>
  <text class="title" x="65" y="70">Lab 9 breadboard layout — NUCLEO-C031C6</text>
  <text class="subtitle" x="66" y="113">Illustrated like the lab figures. Follow the printed pin names; confirm the actual connected rows on your breadboard.</text>

  <!-- Breadboard body and holes -->
  <rect x="74" y="181" width="944" height="1320" rx="22" fill="#f8fafc" stroke="#a6afb9" stroke-width="4" filter="url(#shadow)"/>
  <text class="part" x="105" y="218">BREADBOARD</text>
  <rect x="112" y="390" width="868" height="424" fill="url(#holes)"/>
  <rect x="112" y="896" width="868" height="392" fill="url(#holes)"/>
  <rect x="112" y="832" width="868" height="45" fill="#e8edf1"/>
  <text class="small" x="650" y="863">center gap</text>
  <line x1="117" y1="273" x2="973" y2="273" stroke="#d23b4a" stroke-width="5"/>
  <line x1="117" y1="325" x2="973" y2="325" stroke="#293240" stroke-width="5"/>
  <text class="pin" x="126" y="257" fill="#d23b4a">3V3 LOGIC RAIL</text>
  <text class="pin" x="126" y="361">GND RAIL</text>
  <line x1="117" y1="1362" x2="973" y2="1362" stroke="#cc700f" stroke-width="5"/>
  <line x1="117" y1="1420" x2="973" y2="1420" stroke="#293240" stroke-width="5"/>
  <text class="pin" x="127" y="1398" fill="#a65709">EXTERNAL + RAIL — 9 V DC</text>
  <text class="pin" x="127" y="1459">COMMON GND RAIL</text>
  <path class="wire black" d="M124 325 L95 325 L95 1420 L124 1420"/>

  <!-- Nucleo board -->
  <rect x="1088" y="228" width="524" height="1238" rx="24" fill="#e8f2ff" stroke="#1f559a" stroke-width="6" filter="url(#shadow)"/>
  <rect x="1291" y="188" width="119" height="72" rx="10" fill="#aeb9c5" stroke="#64748b" stroke-width="4"/>
  <rect x="1310" y="184" width="81" height="32" rx="4" fill="#6b7280"/>
  <text class="part" x="1195" y="281" fill="#15509d">NUCLEO-C031C6</text>
  <text class="small" x="1218" y="316">USB / ST-LINK console</text>
  <rect x="1232" y="941" width="231" height="158" rx="13" fill="#252d38" stroke="#111827" stroke-width="4"/>
  <text class="lighttext" x="1265" y="1020" font-family="Arial, sans-serif" font-size="28" font-weight="bold">STM32C031</text>
  <circle cx="1350" cy="1217" r="27" fill="#55ba48" stroke="#2f7734" stroke-width="4"/>
  <text class="small" x="1263" y="1274">PA5 / D13 LED</text>
  <text class="small" x="1166" y="1384">Pin order here is grouped for readability.</text>
  <text class="small" x="1166" y="1412">Use the labels printed on your real board.</text>

  <!-- Nucleo left pin nodes -->
  <g class="ring">
    <circle cx="1088" cy="365" r="13"/><circle cx="1088" cy="408" r="13"/>
    <circle cx="1088" cy="505" r="13"/>
    <circle cx="1088" cy="934" r="13"/><circle cx="1088" cy="1137" r="13"/>
    <circle cx="1088" cy="1420" r="13"/>
  </g>
  <g class="pin">
    <text x="1124" y="373">3V3</text>
    <text x="1124" y="416">GND</text>
    <text x="1124" y="513">A3 / PB1</text>
    <text x="1124" y="942">D4 / PB10</text>
    <text x="1124" y="1145">D6 / PB5</text>
    <text x="1124" y="1428">GND</text>
  </g>

  <!-- Nucleo right pin nodes -->
  <g class="ring">
    <circle cx="1612" cy="604" r="13"/><circle cx="1612" cy="658" r="13"/>
    <circle cx="1612" cy="712" r="13"/><circle cx="1612" cy="766" r="13"/>
    <circle cx="1612" cy="820" r="13"/><circle cx="1612" cy="874" r="13"/>
    <circle cx="1612" cy="928" r="13"/>
  </g>
  <g class="pin" text-anchor="end">
    <text x="1574" y="612">D1 / PB6 TX</text>
    <text x="1574" y="666">D0 / PB7 RX</text>
    <text x="1574" y="720">D5 / PB4 CTS</text>
    <text x="1574" y="774">D3 / PB3 RTS</text>
    <text x="1574" y="828">D10 / PB0 MOD</text>
    <text x="1574" y="882">3V3</text>
    <text x="1574" y="936">GND</text>
  </g>

  <!-- Nucleo power to logic rails and shared ground -->
  <path class="wire red" d="M1075 365 L1039 365 L1039 245 L951 245 L951 273"/>
  <path class="wire black" d="M1075 408 L1018 408 L1018 325 L951 325"/>
  <path class="wire black" d="M1075 1420 L947 1420"/>

  <!-- Pot: two outer terminals and a wiper -->
  <rect x="244" y="440" width="245" height="148" rx="19" fill="#353d47" stroke="#181f29" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="366" cy="514" r="54" fill="#b9c0c7" stroke="#586472" stroke-width="5"/>
  <circle cx="366" cy="514" r="34" fill="#eff3f6" stroke="#586472" stroke-width="4"/>
  <line x1="366" y1="514" x2="390" y2="488" stroke="#586472" stroke-width="6"/>
  <text class="part" x="265" y="426">POTENTIOMETER</text>
  <circle cx="244" cy="480" r="9" fill="#d23b4a"/><circle cx="244" cy="552" r="9" fill="#293240"/>
  <circle cx="489" cy="505" r="9" fill="#159661"/>
  <path class="wire red" d="M235 480 L203 480 L203 273"/>
  <path class="wire black" d="M235 552 L175 552 L175 325"/>
  <path class="wire green" d="M498 505 L521 505 L521 376 L996 376 L996 505 L1075 505"/>

  <text class="small" x="601" y="655">A0 / PA0 unused</text>

  <!-- Pushbutton across central gap; capacitor in parallel -->
  <text class="part" x="240" y="810">TOGGLE PUSHBUTTON</text>
  <rect x="297" y="823" width="253" height="121" rx="16" fill="#1f2937" stroke="#111827" stroke-width="5" filter="url(#shadow)"/>
  <rect x="346" y="818" width="154" height="117" rx="16" fill="#c93d38" stroke="#832323" stroke-width="5"/>
  <circle cx="284" cy="850" r="10" fill="#293240"/><circle cx="563" cy="921" r="10" fill="#3072db"/>
  <path class="wire black" d="M274 850 L166 850 L166 325"/>
  <path class="wire blue" d="M573 921 L849 921 L849 934 L1075 934"/>
  <rect x="797" y="1003" width="112" height="51" rx="11" fill="#ddb86e" stroke="#96743d" stroke-width="4"/>
  <text class="small" x="815" y="1037">0.15 µF</text>
  <path class="wire blue" d="M849 934 L849 1002"/>
  <path class="wire black" d="M849 1055 L849 1072 L283 1072 L283 850"/>
  <text class="small" x="296" y="981">each press toggles</text>

  <!-- Transistor driver, solenoid and power adapter -->
  <text class="part" x="219" y="1107">SOLENOID DRIVER</text>
  <rect x="393" y="1129" width="175" height="113" rx="9" fill="#21262d" stroke="#0c1117" stroke-width="5" filter="url(#shadow)"/>
  <rect x="427" y="1110" width="107" height="30" rx="3" fill="#b5bbc2" stroke="#67717e" stroke-width="4"/>
  <text class="lighttext" x="413" y="1192" font-family="Arial, sans-serif" font-size="24">KSC2073</text>
  <line x1="420" y1="1242" x2="420" y2="1289" stroke="#a7adb3" stroke-width="18"/>
  <line x1="480" y1="1242" x2="480" y2="1289" stroke="#a7adb3" stroke-width="18"/>
  <line x1="540" y1="1242" x2="540" y2="1289" stroke="#a7adb3" stroke-width="18"/>
  <text class="pin" x="410" y="1317">B</text><text class="pin" x="470" y="1317">C</text><text class="pin" x="530" y="1317">E</text>
  <rect x="663" y="1257" width="159" height="48" rx="20" fill="#e2c395" stroke="#8a6d4c" stroke-width="4"/>
  <line x1="698" y1="1258" x2="698" y2="1304" stroke="#89421d" stroke-width="9"/>
  <line x1="727" y1="1258" x2="727" y2="1304" stroke="#111827" stroke-width="9"/>
  <line x1="756" y1="1258" x2="756" y2="1304" stroke="#89421d" stroke-width="9"/>
  <text class="small" x="680" y="1225">150 Ω</text>
  <path class="wire yellow" d="M420 1289 L420 1326 L627 1326 L627 1281 L662 1281 M822 1281 L998 1281 L998 1137 L1075 1137"/>
  <path class="wire black" d="M540 1289 L540 1420"/>
  <rect x="184" y="1164" width="129" height="118" rx="17" fill="#d0a24c" stroke="#74531d" stroke-width="5"/>
  <rect x="219" y="1177" width="61" height="88" rx="6" fill="#26303b"/>
  <rect x="243" y="1133" width="14" height="48" fill="#b9c0c8"/>
  <path class="wire orange" d="M201 1280 L151 1280 L151 1362"/>
  <path d="M480 1310 L480 1341" fill="none" stroke="#f8fafc" stroke-width="19"/>
  <path class="wire black" d="M294 1280 L294 1333 L480 1333 L480 1289"/>
  <text class="small" x="136" y="1313">red +</text>
  <text class="small" x="292" y="1311">black → C</text>
  <rect x="800" y="1316" width="178" height="95" rx="15" fill="#e5e7eb" stroke="#606b78" stroke-width="4"/>
  <text class="part" x="825" y="1355">ADAPTER</text>
  <text class="small" x="821" y="1382">9 V DC</text>
  <path class="wire orange" d="M800 1362 L780 1362"/>
  <path class="wire black" d="M800 1400 L780 1400"/>

  <!-- Bluefruit module with direct pin-to-pin wires -->
  <rect x="1773" y="502" width="514" height="515" rx="25" fill="#238461" stroke="#125844" stroke-width="7" filter="url(#shadow)"/>
  <text class="lighttext" x="1829" y="554" font-family="Arial, sans-serif" font-size="31" font-weight="bold">Bluefruit LE UART Friend</text>
  <rect x="2092" y="732" width="123" height="112" rx="10" fill="#1c2932" stroke="#0b1720" stroke-width="4"/>
  <text class="lighttext" x="2112" y="793" font-family="Arial, sans-serif" font-size="22">BLE</text>
  <rect x="1968" y="731" width="70" height="121" rx="9" fill="#e6e9ee" stroke="#5f6b76" stroke-width="4"/>
  <text class="small" x="1981" y="786">SW</text>
  <g class="ring"><circle cx="1773" cy="604" r="13"/><circle cx="1773" cy="658" r="13"/>
    <circle cx="1773" cy="712" r="13"/><circle cx="1773" cy="766" r="13"/>
    <circle cx="1773" cy="820" r="13"/><circle cx="1773" cy="874" r="13"/><circle cx="1773" cy="928" r="13"/>
  </g>
  <g class="pin"><text x="1815" y="612">RXI</text><text x="1815" y="666">TXO</text>
    <text x="1815" y="720">RTS</text><text x="1815" y="774">CTS</text>
    <text x="1815" y="828">MOD</text><text x="1815" y="882">VIN</text>
    <text x="1815" y="936">GND</text></g>
  <path class="wire blue" d="M1625 604 L1760 604"/>
  <path class="wire green" d="M1625 658 L1760 658"/>
  <path class="wire purple" d="M1625 712 L1760 712"/>
  <path class="wire purple" d="M1625 766 L1760 766"/>
  <path class="wire grey" d="M1625 820 L1760 820"/>
  <path class="wire red" d="M1625 874 L1760 874"/>
  <path class="wire black" d="M1625 928 L1760 928"/>
  <text class="small" x="1787" y="1061">Bluefruit CTS/RTS names cross the Nucleo's roles.</text>

  <!-- Safety and interpretation note -->
  <rect x="1685" y="1144" width="636" height="253" rx="20" fill="#fff8e8" stroke="#c57a20" stroke-width="4"/>
  <text class="part" x="1722" y="1189">BEFORE APPLYING POWER</text>
  <text class="small" x="1722" y="1231">Confirm the actual KSC2073 B–C–E orientation,</text>
  <text class="small" x="1722" y="1266">150 Ω base resistor, and 9 V DC adapter label.</text>
  <text class="small" x="1722" y="1301">Keep the 9 V rail separate from Nucleo 3V3.</text>
  <text class="small" x="1722" y="1344">Hold build: PB5 and LD4 follow toggle state.</text>
  <rect x="1685" y="1412" width="636" height="130" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text class="small" x="1712" y="1450">Top red rail is 3V3; bottom orange rail is</text>
  <text class="small" x="1712" y="1481">external positive. The black jumper joins GND rails.</text>
  <text class="small" x="1712" y="1512">The 0.15 µF cap bridges PB10 and GND.</text>

  <text class="small" x="70" y="1557">Placement example: use the pin labels and connected rows. Crossing wires without a dot do not join. Check rail breaks and button leg continuity.</text>
</svg>
