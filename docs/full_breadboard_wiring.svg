<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-label="Complete Lab 9 breadboard prototype wiring schematic">
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; }
    .section { font-size: 27px; font-weight: 700; fill: #173b87; }
    .label { font-size: 21px; font-weight: 600; }
    .small { font-size: 17px; fill: #475569; }
    .signal { stroke: #2854ce; stroke-width: 5; fill: none; }
    .power { stroke: #c21f49; stroke-width: 6; fill: none; }
    .ground { stroke: #253143; stroke-width: 6; fill: none; }
    .coil { stroke: #ad5b00; stroke-width: 6; fill: none; }
    .panel { fill: #fbfcff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
  </style>
  <rect width="1600" height="1260" fill="#ffffff"/>
  <text class="title" x="38" y="54">ENGS 28 Lab 9: full breadboard prototype wiring</text>
  <text class="small" x="40" y="83">Circuit schematic and exact pin names; breadboard hole positions depend on your actual parts. Assemble with USB and coil supply unplugged.</text>

  <!-- Low-voltage sensor section -->
  <rect class="panel" x="30" y="105" width="1540" height="375"/>
  <text class="section" x="55" y="145">1. 3.3 V logic inputs</text>
  <line class="power" x1="145" y1="188" x2="1505" y2="188"/>
  <text class="label" x="55" y="195" fill="#c21f49">3V3</text>
  <text class="small" x="250" y="177">Nucleo 3V3 to dedicated low-voltage rail</text>
  <line class="ground" x1="145" y1="430" x2="1505" y2="430"/>
  <text class="label" x="55" y="437">GND</text>
  <text class="small" x="250" y="457">Nucleo GND to logic ground rail</text>

  <!-- Potentiometer -->
  <line class="power" x1="310" y1="188" x2="310" y2="253"/>
  <rect x="240" y="253" width="140" height="112" rx="14" fill="#eaf7ee" stroke="#16834a" stroke-width="3"/>
  <text class="label" x="285" y="296">POT</text>
  <text class="small" x="267" y="325">3 terminals</text>
  <line class="ground" x1="310" y1="365" x2="310" y2="430"/>
  <line class="signal" x1="380" y1="309" x2="525" y2="309"/>
  <text class="label" x="402" y="293">wiper</text>
  <text class="label" x="400" y="339" fill="#2854ce">A3 / PB1</text>

  <!-- LDR divider -->
  <line class="power" x1="775" y1="188" x2="775" y2="230"/>
  <rect x="719" y="230" width="112" height="62" rx="12" fill="#fff7e3" stroke="#a64712" stroke-width="3"/>
  <text class="label" x="749" y="269">LDR</text>
  <line class="signal" x1="775" y1="292" x2="775" y2="335"/>
  <circle cx="775" cy="335" r="8" fill="#2854ce"/>
  <line class="signal" x1="775" y1="335" x2="934" y2="335"/>
  <text class="label" x="815" y="322" fill="#2854ce">A0 / PA0</text>
  <line class="ground" x1="775" y1="335" x2="775" y2="350"/>
  <rect x="720" y="350" width="110" height="53" rx="10" fill="#fff7e3" stroke="#a64712" stroke-width="3"/>
  <text class="label" x="739" y="383">10 kΩ</text>
  <line class="ground" x1="775" y1="403" x2="775" y2="430"/>

  <!-- Pushbutton -->
  <text class="label" x="1080" y="277">D4 / PB10</text>
  <line class="signal" x1="1100" y1="312" x2="1220" y2="312"/>
  <circle cx="1220" cy="312" r="7" fill="#253143"/>
  <circle cx="1300" cy="312" r="7" fill="#253143"/>
  <line class="ground" x1="1225" y1="304" x2="1288" y2="278"/>
  <line class="ground" x1="1300" y1="312" x2="1380" y2="312"/>
  <line class="ground" x1="1380" y1="312" x2="1380" y2="430"/>
  <text class="small" x="1082" y="364">Pushbutton, normally open pair</text>
  <text class="small" x="1082" y="390">Pressed = simulated CLOSED</text>
  <text class="small" x="1082" y="413">MCU internal pull-up; no 3V3 wire</text>

  <!-- BLE section -->
  <rect class="panel" x="30" y="505" width="1540" height="383"/>
  <text class="section" x="55" y="544">2. Adafruit Bluefruit LE UART Friend</text>
  <text class="small" x="83" y="572">NUCLEO-C031C6 Arduino label / MCU function</text>
  <text class="small" x="1005" y="572">Read these exact labels on the UART Friend board</text>
  <rect x="65" y="582" width="570" height="260" rx="16" fill="#eef3ff" stroke="#173b87" stroke-width="3"/>
  <rect x="965" y="582" width="570" height="260" rx="16" fill="#e9f8ee" stroke="#16834a" stroke-width="3"/>
  <g class="label">
    <text x="280" y="616">D1 / PB6 / USART1 TX, AF0</text>
    <text x="280" y="650">D0 / PB7 / USART1 RX, AF0</text>
    <text x="280" y="684">D5 / PB4 / USART1 CTS, AF4</text>
    <text x="280" y="718">D3 / PB3 / USART1 RTS, AF4</text>
    <text x="280" y="752">D10 / PB0 / GPIO output</text>
    <text x="542" y="786">3V3</text>
    <text x="542" y="820">GND</text>
    <text x="997" y="616">RXI</text>
    <text x="997" y="650">TXO</text>
    <text x="997" y="684">RTS</text>
    <text x="997" y="718">CTS</text>
    <text x="997" y="752">MOD</text>
    <text x="997" y="786">VIN</text>
    <text x="997" y="820">GND</text>
  </g>
  <g class="signal">
    <line x1="635" y1="607" x2="965" y2="607"/>
    <line x1="635" y1="641" x2="965" y2="641"/>
    <line x1="635" y1="675" x2="965" y2="675"/>
    <line x1="635" y1="709" x2="965" y2="709"/>
    <line x1="635" y1="743" x2="965" y2="743"/>
  </g>
  <line class="power" x1="635" y1="777" x2="965" y2="777"/>
  <line class="ground" x1="635" y1="811" x2="965" y2="811"/>
  <text class="small" x="70" y="875">On-board LED: D13 / PA5; no external wire. USB console: PA2/PA3 through ST-LINK; no jumper wire.</text>

  <!-- Solenoid section -->
  <rect class="panel" x="30" y="912" width="1540" height="317"/>
  <text class="section" x="55" y="952">3. Lab 3 low-side solenoid driver — external supply remains DISCONNECTED for now</text>
  <text class="label" x="75" y="1065">D6 / PB5</text>
  <line class="signal" x1="205" y1="1057" x2="325" y2="1057"/>
  <rect x="325" y="1028" width="215" height="58" rx="10" fill="#fff7e3" stroke="#a64712" stroke-width="3"/>
  <text class="label" x="357" y="1065">Rlim: verify value</text>
  <line class="signal" x1="540" y1="1057" x2="677" y2="1057"/>
  <circle cx="705" cy="1057" r="28" fill="#ffffff" stroke="#253143" stroke-width="3"/>
  <text class="label" x="688" y="1065">B</text>
  <line class="ground" x1="733" y1="1040" x2="826" y2="1011"/>
  <line class="ground" x1="733" y1="1075" x2="826" y2="1105"/>
  <text class="label" x="838" y="1019">C</text>
  <text class="label" x="838" y="1112">E</text>
  <line class="coil" x1="826" y1="1011" x2="1045" y2="1011"/>
  <rect x="1045" y="978" width="155" height="65" rx="14" fill="#fff4e5" stroke="#ad5b00" stroke-width="3"/>
  <text class="label" x="1065" y="1007">Solenoid</text>
  <text class="small" x="1086" y="1030">black lead</text>
  <line class="coil" x1="1122" y1="978" x2="1122" y2="967"/>
  <line class="coil" x1="1122" y1="967" x2="1360" y2="967"/>
  <text class="label" x="1367" y="974" fill="#ad5b00">external + (verify)</text>
  <text class="small" x="1220" y="1000">red lead</text>
  <line class="ground" x1="826" y1="1105" x2="826" y2="1165"/>
  <line class="ground" x1="826" y1="1165" x2="1360" y2="1165"/>
  <text class="label" x="1050" y="1149">external − and Nucleo GND</text>
  <text class="small" x="53" y="1206">The class pictured KSC2073TU has B–C–E leads from left to right when viewed as shown; confirm the actual marking and orientation. Never connect the coil directly to PB5.</text>
</svg>
