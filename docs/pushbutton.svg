<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-label="Pushbutton between Nucleo PB10 D4 and ground, with internal pull up">
  <rect width="900" height="310" fill="white"/>
  <text x="40" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#19387f">Toggle pushbutton (3.3 V logic)</text>
  <text x="40" y="94" font-family="Arial, sans-serif" font-size="18" fill="#374151">Pressed = simulated CLOSED. Released = NOT_CLOSED.</text>
  <line x1="175" y1="184" x2="363" y2="184" stroke="#2754c7" stroke-width="5"/>
  <circle cx="175" cy="184" r="9" fill="#2754c7"/>
  <text x="82" y="170" font-family="Arial, sans-serif" font-size="23" fill="#19387f">D4 / PB10</text>
  <circle cx="369" cy="184" r="8" fill="#1f2937"/>
  <circle cx="527" cy="184" r="8" fill="#1f2937"/>
  <line x1="375" y1="176" x2="510" y2="130" stroke="#1f2937" stroke-width="5"/>
  <line x1="527" y1="184" x2="695" y2="184" stroke="#1f2937" stroke-width="5"/>
  <text x="405" y="245" font-family="Arial, sans-serif" font-size="22" fill="#1f2937">Normally open contact</text>
  <text x="705" y="191" font-family="Arial, sans-serif" font-size="23" fill="#1f2937">GND</text>
  <text x="40" y="286" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">PB10 uses the MCU internal pull-up. Verify the chosen physical legs are open until pressed.</text>
</svg>
